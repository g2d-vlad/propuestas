<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preload" as="image" href="01.jpg">
<title>Hablemos Sin Ronroneo</title>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
<style>
/* Layout: a dark studio stage; one slide centered and letterboxed, a quiet control bar beneath. Single dark look on purpose, matching the deck. */
:root{
  --stage:#0b1124;
  --bar:#121a33;
  --ink:#f3ead8;
  --muted:#8e97b3;
  --gold:#f2b84b;
  --neon:#ff5fa2;
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;box-sizing:border-box}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.track{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(24px);transition:opacity .35s ease,transform .35s ease;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide.prev{transform:translateX(-24px)}
.slide img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);user-select:none;-webkit-user-drag:none}
.hit{position:absolute;top:0;bottom:0;width:30%;background:none;border:0;cursor:pointer;z-index:2}
.hit.l{left:0}.hit.r{right:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bar);border-radius:999px;padding:6px 8px;max-width:560px;width:100%;margin:0 auto;box-sizing:border-box}
.btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.btn:hover{background:rgba(255,255,255,.07)}
.btn:focus-visible,.dot:focus-visible,.hit:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.3;cursor:default}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mid{display:flex;align-items:center;gap:14px;min-width:0}
.dots{display:flex;gap:8px}
.dot{width:10px;height:10px;border-radius:999px;border:0;padding:0;background:var(--muted);opacity:.5;cursor:pointer;transition:width .25s ease,background .25s ease,opacity .25s}
.dot.on{width:26px;background:var(--gold);opacity:1}
.count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.count b{color:var(--ink);font-weight:600}
.hint{display:none;text-align:center;font-size:13px;color:var(--muted)}
.hint span{color:var(--neon)}
@media (orientation:portrait) and (max-width:700px){.hint{display:block}}
@media (orientation:landscape) and (max-height:500px){.app{gap:6px;padding-block:6px}.bar{padding:2px 6px}.btn{width:38px;height:38px}}
:fullscreen .app,.fs .app{padding-block:0}
@media (prefers-reduced-motion:reduce){.slide,.dot{transition:none}.slide{transform:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage" aria-roledescription="carrusel" aria-label="Hablemos Sin Ronroneo, propuesta para ALFA">
    <div class="track" id="track"></div>
    <button class="hit l" id="hitL" aria-label="Lámina anterior"></button>
    <button class="hit r" id="hitR" aria-label="Lámina siguiente"></button>
  </div>
  <p class="hint">Gira el teléfono para verlo <span>más grande</span></p>
  <nav class="bar" aria-label="Controles">
    <button class="btn" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="mid">
      <div class="dots" id="dots"></div>
      <span class="count" id="count"><b>1</b> / 4</span>
    </div>
    <button class="btn" id="fs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="btn" id="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </nav>
</div>

<script>
(function(){
  var slides=[
    {src:'01.jpg',alt:'Hablemos Sin Ronroneo. Una voz propia para ALFA. Un podcast para quienes los consideran familia.'},
    {src:'02.jpg',alt:'Personajes que dan voz a la marca: Alfadogcaster, Magnocaster y el invitado.'},
    {src:'03.jpg',alt:'De la idea al programa. Desarrollo creativo y puesta en marcha, 8,000 MXN pago único.'},
    {src:'04.jpg',alt:'La conversación continúa. Dirección creativa y producción mensual, 6,000 MXN al mes.'}
  ];
  var track=document.getElementById('track'),dots=document.getElementById('dots'),count=document.getElementById('count');
  var prevB=document.getElementById('prev'),nextB=document.getElementById('next');
  var i=0,els=[],ds=[];
  slides.forEach(function(s,n){
    var d=document.createElement('div');d.className='slide';d.setAttribute('aria-hidden','true');
    var im=document.createElement('img');im.src=s.src;im.alt=s.alt;im.decoding='async';im.draggable=false;
    d.appendChild(im);track.appendChild(d);els.push(d);
    var b=document.createElement('button');b.className='dot';b.setAttribute('aria-label','Ir a la lámina '+(n+1));
    b.onclick=function(){go(n)};dots.appendChild(b);ds.push(b);
  });
  function go(n){
    if(n<0||n>=slides.length)return;
    els.forEach(function(e,k){e.classList.toggle('on',k===n);e.classList.toggle('prev',k<n);e.setAttribute('aria-hidden',k===n?'false':'true')});
    ds.forEach(function(d,k){d.classList.toggle('on',k===n);if(k===n)d.setAttribute('aria-current','true');else d.removeAttribute('aria-current')});
    i=n;count.innerHTML='<b>'+(n+1)+'</b> / '+slides.length;
    prevB.disabled=n===0;nextB.disabled=n===slides.length-1;
  }
  prevB.onclick=function(){go(i-1)};nextB.onclick=function(){go(i+1)};
  document.getElementById('hitL').onclick=function(){go(i-1)};
  document.getElementById('hitR').onclick=function(){go(i+1)};
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(i+1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1)}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);
  });
  var x0=null,y0=null,stage=document.getElementById('stage');
  stage.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  stage.addEventListener('touchend',function(e){
    if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))go(i+(dx<0?1:-1));x0=null;
  },{passive:true});
  var fsB=document.getElementById('fs'),app=document.documentElement;
  if(!(app.requestFullscreen||app.webkitRequestFullscreen))fsB.hidden=true;
  fsB.onclick=function(){
    try{
      if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
      else{var p=(app.requestFullscreen||app.webkitRequestFullscreen).call(app);if(p&&p.catch)p.catch(function(){fsB.hidden=true})}
    }catch(err){fsB.hidden=true}
  };
  var h=(location.hash||'').replace('#','');var start=/^[1-4]$/.test(h)?+h-1:0;
  go(start);
})();
</script>

</body>
</html>
